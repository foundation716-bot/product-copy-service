# CI/CD 전체 파이프라인
# 필요한 Secrets: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
name: CI-CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 테스트 실행
        # 커버리지 85% 미만이면 테스트가 모두 통과해도 실패 → 테스트를 지우는 변경을 막는다
        run: pytest -q --cov=app --cov-fail-under=85

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Docker 이미지 빌드 (빌드 가능 여부만 검증)
        run: docker build -t product-copy-service:${{ github.sha }} .

  deploy:
    needs: build
    # PR에서는 배포하지 않는다 — main에 push됐을 때만
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드·ECR 푸시
        run: |
          docker build -t ${{ steps.ecr.outputs.registry }}/product-copy-service:latest .
          docker push ${{ steps.ecr.outputs.registry }}/product-copy-service:latest

      - name: 서버 배포 확인
        run: echo "ECR 이미지 업로드 완료. EC2가 다음 주기에 자동으로 가져옵니다."

